[project]
name = "gaia-pipeline"
version = "0.1.0"
description = "Gaia AI ecological intelligence layer — ingestion and validation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pystac-client>=0.8",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.8",
    "python-ulid>=2.7",
    "tenacity>=9.0",
    "h3>=4.5.0",
    "scikit-learn>=1.9.0",
    "pytz>=2026.3.post1",
    "pyogrio>=0.13.0",
]

[project.scripts]
gaia = "gaia_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options as call expressions in argument defaults. That is the
# framework's interface, not an accident.
"src/gaia_pipeline/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
